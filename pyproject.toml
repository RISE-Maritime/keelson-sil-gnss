[project]
name = "keelson-sil-gnss"
version = "0.1.0"
description = "Simulated GNSS receiver for software-in-the-loop testing: truth in, location_fix out"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    # PINNED EXACTLY to the build Slipway runs, so the two agree on every
    # payload — its experimental channel, where newer is not always a superset,
    # so a bump is checked rather than taken. It used to be an alpha carrying
    # `keelson.geodesy` (keelson#245); that pull request was closed unmerged,
    # the maintainer's view being that numerical helpers are not the SDK's to
    # own and a component should depend on pymap3d — which this now does.
    "keelson==0.6.0.dev15",
    # The ellipsoid: exact WGS84 ENU <-> geodetic, no required dependencies.
    "pymap3d>=3.1",
    "eclipse-zenoh>=1.2.1",
]

[project.scripts]
keelson-sil-gnss = "keelson_sil_gnss.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keelson_sil_gnss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
